name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消还在排队的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages 必须先在 Settings -> Pages 里把 Source 设成 GitHub Actions。
      # 这一步不能自动做：Actions 的 GITHUB_TOKEN 没有创建 Pages 站点的权限
      # （enablement: true 会以 "Resource not accessible by integration" 失败）。
      - uses: actions/configure-pages@v5

      # 只把游戏本体打包上去，不带 .git / .github
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html style.css *.js .nojekyll _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
