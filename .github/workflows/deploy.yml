name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消还在排队的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 会在第一次运行时自动打开这个仓库的 Pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 只把游戏本体打包上去，不带 .git / .github
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html style.css *.js .nojekyll _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
