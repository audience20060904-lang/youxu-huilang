<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>幽墟回廊 · 战场</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F1EBDD">
<link rel="stylesheet" href="battle.css">
</head>
<body>

<div id="errbar" hidden></div>

<div id="app">

  <!-- ===== 顶栏 ===== -->
  <button class="pausebtn" id="btnPause">暂停</button>
  <div class="hud" id="hud">
    <div class="hudrow">
      <b id="hWave">第 1 波</b>
      <span id="hTime">30</span>
      <span class="sp"></span>
      <b id="hLvl">Lv 1</b>
      <span id="hGold">0</span>
      <span id="hKill">0</span>
    </div>
    <div class="xpbar"><i id="xpFill"></i></div>
    <div class="bossbar" id="bossBar" hidden><i id="bossFill"></i><b id="bossName"></b></div>
  </div>

  <!-- ===== 画布 ===== -->
  <canvas id="cv"></canvas>

  <!-- ===== 底部血条 ===== -->
  <div class="foot">
    <div class="hpbar"><i id="hpFill"></i><u id="shFill"></u><b id="hpTxt">100 / 100</b></div>
    <div class="fbtns">
      <button class="fb" id="btnInfo">信息</button>
      <button class="fb" id="btnBag">遗物</button>
      <button class="fb" id="btnSp">特殊</button>
    </div>
  </div>

  <!-- 摇杆（触屏按下才显示） -->
  <div id="stick" hidden><i id="stickNub"></i></div>

  <!-- ===== 弹层 ===== -->

  <!-- 开场：选难度层 -->
  <div class="veil" id="veilStart">
    <div class="box">
      <h2>战场</h2>
      <p class="sub">走位躲怪，刀会自己挥。每升一级从四件遗物里挑一件。轮数没有尽头。</p>
      <div id="tierList"></div>
      <div class="rowb">
        <a class="btn ghost" href="index.html">回主城</a>
        <button class="btn" id="btnGo">下场</button>
      </div>
    </div>
  </div>

  <!-- 升级四选一 -->
  <div class="veil" id="veilPick">
    <div class="box">
      <h2 id="pickTitle">升到 2 级</h2>
      <p class="sub">挑一件带走</p>
      <div id="pickList" class="cards"></div>
      <div class="rowb">
        <button class="btn ghost" id="btnRedraw" hidden>换一批</button>
        <button class="btn ghost" id="btnSkipPick">都不要</button>
      </div>
    </div>
  </div>

  <!-- 带满了的取舍 -->
  <div class="veil" id="veilSwap">
    <div class="box">
      <h2>遗物带满了</h2>
      <p class="sub">换掉一件，换下来的当场分解成金币</p>
      <div id="swapNew" class="cards"></div>
      <div class="hr">身上的</div>
      <div id="swapOld" class="cards"></div>
    </div>
  </div>

  <!-- 信息：面板数值单独一个按钮（用户 2026-09-22 从遗物页拆出来的）-->
  <div class="veil" id="veilInfo">
    <div class="box">
      <h2>信息</h2>
      <p class="sub" id="infoSub"></p>
      <div id="infoStats" class="stats"></div>
      <div class="rowb">
        <button class="btn" id="btnInfoClose">继续</button>
      </div>
    </div>
  </div>

  <!-- 特殊遗物：打 Boss 掉的，不占 15 个遗物位 -->
  <div class="veil" id="veilSp">
    <div class="box wide col">
      <h2 id="spTitle">特殊遗物</h2>
      <p class="sub">打倒 Boss 才有，不占遗物位，也不能分解或当合成材料。</p>
      <div class="scroll"><div id="spList" class="cards"></div></div>
      <div class="rowb pin">
        <button class="btn" id="btnSpClose">继续</button>
      </div>
    </div>
  </div>

  <!-- Boss 掉落的特殊遗物三选一 -->
  <div class="veil" id="veilSpPick">
    <div class="box">
      <h2>Boss 倒下了</h2>
      <p class="sub">从三件特殊遗物里挑一件 —— 它不占遗物位</p>
      <div id="spPickList" class="cards"></div>
    </div>
  </div>

  <!-- 遗物页（合成面板就在这儿，随时能开）-->
  <div class="veil" id="veilBag">
    <div class="box wide col">
      <h2 id="bagTitle">遗物 0 / 15</h2>
      <p class="sub" id="fuseSub"></p>
      <div class="scroll"><div id="bagList" class="cards"></div></div>
      <!-- ⚠️ 这三个钉在遗物栏下面（用户 2026-09-22）：带满 15 件时列表很长，
           按钮跟着滚下去就找不着了。别把它们塞回 .scroll 里面。 -->
      <div class="rowb pin">
        <button class="btn ghost" id="btnFuseMode">选择材料</button>
        <button class="btn ghost" id="btnFuseGo">合成</button>
        <button class="btn" id="btnBagClose">继续</button>
      </div>
    </div>
  </div>

  <!-- 游商（击杀掉落，踩上去弹出）-->
  <div class="veil" id="veilShop">
    <div class="box wide">
      <h2>游商</h2>
      <p class="sub" id="shopSub">金币 0</p>
      <div id="shopList" class="cards"></div>
      <div class="rowb">
        <button class="btn ghost" id="btnShopRe">刷新货架</button>
        <button class="btn" id="btnShopClose">走了</button>
      </div>
    </div>
  </div>

  <!-- 合成三选一 -->
  <div class="veil" id="veilGot">
    <div class="box">
      <h2 id="gotTitle">挑一件</h2>
      <div id="gotList" class="cards"></div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="veil" id="veilPause">
    <div class="box">
      <h2>暂停</h2>
      <div class="rowb">
        <button class="btn" id="btnResume">继续</button>
        <button class="btn ghost" id="btnQuit">放弃这一趟</button>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="veil" id="veilEnd">
    <div class="box col">
      <h2 id="endTitle">倒下了</h2>
      <div class="scroll">
        <div id="endStats" class="stats"></div>
        <div id="endRelics" class="cards"></div>
      </div>
      <div class="rowb pin">
        <a class="btn ghost" href="index.html">回主城</a>
        <button class="btn" id="btnAgain">再来一次</button>
      </div>
    </div>
  </div>

</div>

<script src="util.js"></script>
<script src="art.js"></script>
<script src="content.js"></script>
<script src="battle.js"></script>
</body>
</html>
